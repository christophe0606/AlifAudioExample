# A project translates into one executable or library.
project:
  device: :M55_HE

  groups:
    - group: AIApplication
      files:
        - file: ./app_main.cpp
        - file: ./streamgraph/common/template_instantiations.cpp
        - file: ./container.c 
          not-for-context: .Debug
        - file: ./md5.c 
          not-for-context: .Debug
       

    - group: appa
      files:
        - file: ./streamgraph/appa/scheduler_appa.cpp
        - file: ./streamgraph/appa/appa_params.c

    - group: appb
      files:
        - file: ./streamgraph/appb/scheduler_appb.cpp
        - file: ./streamgraph/appb/appb_params.c

    - group: Stream runtime
      files:
        - file: "C:/Users/chrfav01/benchresults/CMSIS-Stream/platform/cmsis_rtos_runtime/stream_event_queue.cpp"
        - file: "C:/Users/chrfav01/benchresults/CMSIS-Stream/platform/cmsis_rtos_runtime/stream_runtime_init.cpp"

    - group: Stream nodes
      files:
        - file: streamgraph/nodes_src/camera.c 
        - file: streamgraph/nodes_src/kws_img.c 
        - file: streamgraph/nodes_src/kws_mfcc.c
        - file: streamgraph/nodes_src/lcd.c
        - file: streamgraph/nodes_src/init_drv_src.cpp


    - group: ML models
      files:
        - file: ./../networks/network.cpp
        - file: ./../networks/kws_micronet_m_vela_H128.tflite.cpp
          for-context: .Debug

  add-path:
    - .
    - ./streamgraph/stream_nodes
    - ./streamgraph/common
    - ./streamgraph
    - ./streamgraph/nodes_src
    - "C:/Users/chrfav01/benchresults/CMSIS-Stream/platform"
    - "C:/Users/chrfav01/benchresults/CMSIS-Stream/platform/cmsis_rtos_runtime"
    - ./../networks
    - ./streamgraph/appa
    - ./streamgraph/appb

  define:
    - ACTIVATION_BUF_SZ: 131072

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  components:
    - component: CMSIS:DSP&Source
      misc:
        - for-compiler: AC6
          C-CPP:
            - -Wno-nan-infinity-disabled
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source

    - component: CMSIS:NN Lib
    - component: Data Exchange:Serialization:flatbuffers&tensorflow
    - component: Data Processing:Math:gemmlowp fixed-point&tensorflow
    - component: Data Processing:Math:kissfft&tensorflow
    - component: Data Processing:Math:ruy&tensorflow

    # TensorFlow Kernel variant for devices without Ethos-U
    #- component: Machine Learning:TensorFlow:Kernel&CMSIS-NN
    #  not-for-context: \.*-U[0-9]{2}.*
    # TensorFlow Kernel variant for devices with Ethos-U
    - component: Machine Learning:TensorFlow:Kernel&Ethos-U
    #  for-context: \.*-U[0-9]{2}.*

    - component: Machine Learning:TensorFlow:Kernel Utils
    - component: Machine Learning:TensorFlow:Testing
    - component: Device:SOC Peripherals:OSPI
    - component: BSP:OSPI FLASH XIP:core

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: ../speex.clayer.yml

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map

  connections:
    - connect: Board Layer with Audio interface
      consumes:
        - CMSIS_VSTREAM_AUDIO_IN
      provides:
        - CMSIS-RTOS2

  packs:
    - pack: ARM::CMSIS@^6.3.0
    - pack: ARM::CMSIS-DSP@^1.16.0
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: ARM::CMSIS-Compiler
    - pack: ARM::ethos-u-core-driver
    - pack: AlifSemiconductor::Ensemble

    - pack: ARM::CMSIS-NN@^7.0.0
    - pack: tensorflow::flatbuffers@^1.25.2
    - pack: tensorflow::gemmlowp@^1.25.2
    - pack: tensorflow::kissfft@^1.25.2
    - pack: tensorflow::ruy@^1.25.2
    - pack: tensorflow::tensorflow-lite-micro@^1.25.2

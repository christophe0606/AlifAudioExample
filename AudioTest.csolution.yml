# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.6.0
  cdefault: # use CMSIS-Toolbox default Compiler options

  # Compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: IAR
    - compiler: CLANG

  # List of miscellaneous tool-specific controls
  misc:
    - for-compiler: AC6 # GDB requires DWARF 5, remove when using uVision Debugger
      C-CPP:
        - -gdwarf-5
      ASM:
        - -gdwarf-5

  # List the packs that define the device and/or board.
  packs:
    - pack: AlifSemiconductor::Ensemble@2.0.2
    - pack: ARM::CMSIS@6.2.0
    - pack: AlifSemiconductor::Dave2DDriver@2.0.1
    - pack: AlifSemiconductor::AIPL@1.3.0

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: AE722F80F55D5LS
      board: AppKit-E7-AIML:Gen 2
      device: AE722F80F55D5LS
      variables:
        - Board-Layer: $SolutionDir()$/board/AppKit-E7_M55_HE/Board_HE.clayer.yml
          copied-from: ${CMSIS_PACK_ROOT}/AlifSemiconductor/Ensemble/2.0.2/Boards/AppKit-e7-aiml/Layers/M55_HE/Board_HE.clayer.yml
      target-set:
        - set:
          images:
            - project-context: M55_HE.Debug
          debugger:
            name: ULINKplus@pyOCD
            port: 3333
            protocol: swd
            clock: 10000000

  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none

    - type: Release
      debug: off
      optimize: balanced

  # List related projects.
  projects:
    - project: App_HE/M55_HE.cproject.yml
  compiler: AC6
